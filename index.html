<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#012d1d" />
    <meta name="description" content="Build a fresh provision request with Zorch Farms, Lagos." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
    <!-- GitHub Pages SPA redirect restore: runs before the app so React Router sees the real path -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search)
        var redirect = params.get('redirect')
        if (redirect) {
          window.history.replaceState(null, '', '/Zorch-Farms' + redirect)
        }
      })()
    </script>
    <title>Zorch Farms | Fresh provisions, simplified</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
